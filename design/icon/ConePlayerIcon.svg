<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cone Player app icon: a cone lying on its side, pointing right, so it is also a
       play button. Its round base shows as an oval on the left. No stripes or base
       block, so it doesn't read as VLC's traffic cone. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0E0E0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#D37918" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D37918" stop-opacity="0"/>
    </radialGradient>
    <!-- Body shading: lit from the top, darker underneath -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4A04A"/>
      <stop offset="0.45" stop-color="#D37918"/>
      <stop offset="1" stop-color="#9A520C"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A3F08"/>
      <stop offset="1" stop-color="#4A2604"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="coneShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS icon tile: 824×824 inset 100 px -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Cone body: base oval at x=352 (ry 236, rx 74), apex at x=764. The outer half of
       the oval closes the body, the rounded stroke softens the tip. -->
  <g filter="url(#coneShadow)">
    <path d="M352 276 L764 512 L352 748 A74 236 0 0 1 352 276 Z"
          fill="url(#body)" stroke="url(#body)" stroke-width="28" stroke-linejoin="round"/>
  </g>
  <!-- Highlight along the top edge -->
  <path d="M370 300 L700 490 L690 506 L362 326 Z" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- Base face: the open round end of the cone -->
  <ellipse cx="352" cy="512" rx="62" ry="222" fill="url(#face)"/>
  <ellipse cx="352" cy="512" rx="62" ry="222" fill="none" stroke="#F5DDC2" stroke-opacity="0.85" stroke-width="10"/>
</svg>
