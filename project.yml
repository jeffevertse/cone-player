name: ConePlayer
options:
  bundleIdPrefix: com.jeffevertse
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    exactVersion: 4.0.0-a25
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
targets:
  ConePlayer:
    type: application
    platform: macOS
    sources:
      - ConePlayer/Sources
    dependencies:
      - package: VLCKit
    info:
      path: ConePlayer/Info.plist
      properties:
        CFBundleDisplayName: Cone Player
        LSApplicationCategoryType: public.app-category.entertainment
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audio]
    entitlements:
      path: ConePlayer/ConePlayer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.assets.movies.read-only: true
        com.apple.security.assets.music.read-only: true
        com.apple.security.network.client: true
        com.apple.security.cs.disable-library-validation: true
