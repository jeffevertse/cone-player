name: ConePlayer
options:
  bundleIdPrefix: com.jeffevertse
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    exactVersion: 4.0.0-a25
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # A stable signing identity lets macOS remember privacy permissions between builds.
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2C39YHVFA2
    ENABLE_HARDENED_RUNTIME: YES
targets:
  ConePlayer:
    type: application
    platform: macOS
    sources:
      - ConePlayer/Sources
      - path: ConePlayer/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: VLCKit
    info:
      path: ConePlayer/Info.plist
      properties:
        CFBundleDisplayName: Cone Player
        ATSApplicationFontsPath: Fonts
        NSLocalNetworkUsageDescription: Cone Player looks for media servers and shared folders on your network so you can play their videos and music.
        NSBonjourServices: [_smb._tcp, _afpovertcp._tcp, _nfs._tcp, _ftp._tcp, _sftp-ssh._tcp, _daap._tcp, _rtsp._tcp, _http._tcp]
        LSApplicationCategoryType: public.app-category.entertainment
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audio]
    entitlements:
      path: ConePlayer/ConePlayer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        # Read-write so recordings can be saved to Movies › Cone Player Recordings.
        com.apple.security.assets.movies.read-write: true
        com.apple.security.assets.music.read-only: true
        com.apple.security.network.client: true
        # UPnP discovery listens for replies from media servers.
        com.apple.security.network.server: true
        com.apple.security.cs.disable-library-validation: true
  ConePlayerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ConePlayerTests
    dependencies:
      - target: ConePlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ConePlayer:
    build:
      targets:
        ConePlayer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ConePlayerTests
